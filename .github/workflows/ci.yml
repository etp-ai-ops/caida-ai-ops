name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check .
      - run: python -m ruff check .
      - run: python -m mypy
      - run: python -m pytest -m 'not integration and not live'

  integration:
    needs: quality-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ITDK_INTEGRATION_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: docker info
      - run: python -m pytest -m integration tests/integration

  production-image:
    needs: quality-and-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build --tag caida-ai-ops:ci .
      # The image previously built and passed every test while being incapable
      # of live Ark measurement: python3-scamper was never installed, and demo
      # mode needs none of it. Assert the capability directly, in the image, so
      # that failure can never again be invisible to CI.
      - name: scamper is importable inside the image
        run: docker run --rm caida-ai-ops:ci python -c "import scamper; print(scamper.__file__)"
      - name: Ark tools report a clear error without the mux socket
        run: |
          docker run --rm caida-ai-ops:ci python -c "
          from caida_ai_ops import ark
          r = ark.list_vps()
          assert r['status'] == 'error', r
          msg = r['error']['message']
          assert 'no Ark mux socket' in msg, msg
          print('degrades correctly:', msg[:70])
          "
