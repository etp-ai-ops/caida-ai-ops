[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "caida-ai-ops"
version = "0.1.0"
description = "Unified MCP tools for CAIDA Ark, ITDK, and AS Rank"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.5,<5",
  "certifi>=2024.8",
  "jsonschema>=4.23,<5",
  "mcp>=2.0,<3",
  "psycopg[binary,pool]>=3.2,<4",
  "python-dotenv>=1.0,<2",
  "SQLAlchemy>=2.0,<3",
  "starlette>=0.41,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "httpx>=0.27,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.15,<5",
  "types-jsonschema>=4.23,<5",
]
notebooks = ["jupyter>=1.1,<2"]

[project.scripts]
caida-ai-ops = "caida_ai_ops.server:main"
caida-itdk-service = "caida_ai_ops.itdk.__main__:main"
caida-itdk-mcp = "caida_ai_ops.itdk_mcp:main"

[tool.hatch.build.targets.wheel]
packages = ["src/caida_ai_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires Docker and an ephemeral PostgreSQL container",
  "live: sends bounded probes through the real Ark mux and is opt-in",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["caida_ai_ops.itdk"]
